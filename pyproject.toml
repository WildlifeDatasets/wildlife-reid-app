[tool.black]
line-length = 120
extend-exclude = '''
(
  /(\.tox|\.codex_tmp|node_modules|temp_data)/
)
'''

[tool.isort]
line_length = 120
profile = "black"
# known_third_party = []
known_first_party = ["fgvc"]
known_local_folder = ["api", "utils", "worker_utils"]
extend_skip = [".tox", ".codex_tmp", "node_modules", "temp_data"]
