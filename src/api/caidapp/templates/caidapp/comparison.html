{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'caidapp/css/comparison.css' %}">
{% endblock %}

{% block body %}
<section class="comparison-page" id="comparison-app"
         data-source-url="{% url 'caidapp:comparison_source' %}"
         data-search-url="{% url 'caidapp:comparison_search' %}">
  <div class="comparison-heading d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h1 class="h3 mb-1">Compare media</h1><p class="text-body-secondary mb-0">Browse two independent sources side by side.</p></div>
    <button type="button" class="btn btn-outline-secondary btn-sm js-comparison-fullscreen"><i class="bi bi-arrows-fullscreen"></i> Full screen</button>
  </div>
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <span class="small text-body-secondary">Both panels</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="Both panel controls">
      <button type="button" class="btn btn-outline-secondary js-comparison-zoom-out" aria-label="Zoom out both panels">&minus;</button>
      <button type="button" class="btn btn-outline-secondary js-comparison-crop" aria-pressed="false">Zoom to bbox</button>
      <button type="button" class="btn btn-outline-secondary js-comparison-zoom-in" aria-label="Zoom in both panels">+</button>
      <button type="button" class="btn btn-outline-secondary js-comparison-reset">Reset view</button>
    </div>
  </div>
  {% if can_exclude_pair %}
  <form id="comparison-exclude-form" method="post" action="{% url 'caidapp:exclude_merge_identity_suggestion' %}" class="mb-3" hidden
        onsubmit="return confirm('Never suggest merging these two identities again, in either direction?');">
    {% csrf_token %}
    <input type="hidden" name="excluded_suggestion">
    <input type="hidden" name="next">
    <button type="submit" class="btn btn-outline-warning btn-sm">Never suggest these identities</button>
  </form>
  {% endif %}
  <div class="comparison-panels">
    <section class="comparison-panel" data-slot="a" aria-label="First comparison source"></section>
    <section class="comparison-panel" data-slot="b" aria-label="Second comparison source"></section>
  </div>
</section>
{% endblock %}

{% block script %}
<script src="{% static 'caidapp/js/comparison.js' %}?v=5"></script>
{% endblock %}
