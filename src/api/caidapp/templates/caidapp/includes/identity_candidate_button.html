{% if observation.pk and not observation.is_no_detection_placeholder and observation.mediafile.media_type == 'image' %}
  {% url 'caidapp:observation_identity_suggestions' observation.uuid as review_url %}
  {% if editor %}
    <button type="button" class="btn btn-sm btn-outline-primary mb-2" data-saved-identity-review="{{ review_url }}?next={{ request.get_full_path|urlencode }}%23observation-{{ observation.pk }}">
      <i class="bi bi-fingerprint" aria-hidden="true"></i> Review identity suggestions
    </button>
  {% else %}
    <a class="btn btn-sm btn-outline-primary" href="{{ review_url }}?next={{ request.get_full_path|urlencode }}%23{{ observation_anchor }}{{ observation.pk }}">
      <i class="bi bi-fingerprint" aria-hidden="true"></i> Review identity suggestions
    </a>
  {% endif %}
{% endif %}
